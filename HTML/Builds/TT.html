<body>
    <h2>Time-Table</h2>
    <table cellpadding="4" cellspacing="2" border="2" style="background-color: black;">
        <tr align="center" style="background-color: lightblue;">
            <th>Time/Day</th>
            <th width="100" align="center">9:10-10:00</th>
            <th width="100" align="center">10:00-10:50</th>
            <th width="100" align="center">10:50-11:00</th>
            <th width="100" align="center">11:00-11:50</th>
            <th width="100" align="center">11:50-12:40</th>
            <th width="100" align="center">12:40-01:30</th>
            <th width="100" align="center">01:30-02:20</th>
        </tr>
        <tr align="center" style="background-color: aliceblue;">
            <td>Monday</td>
            <td>SE</td>
            <td>CA</td> 
            <td rowspan="5">BREAK</td>
            <td> WT</td>
            <td>DBMS</td>
            <td rowspan="5">LUNCH</td>
            <td>OS</td>
        </tr>
         <tr align="center" style="background-color: aliceblue;">
            <td>Tuesday</td>
            <td>SE</td>
            <td>SS</td>
            <td>DBMS</td>
            <td>OS</td>
            <td>AR</td>
        </tr>
        <tr align="center" style="background-color: aliceblue;">
            <td>Wednesday</td>
            <td>CA</td>
            <td>WT</td>
            <td colspan="2" style="text-align: center;">OS LAB</td>
            <td>SE</td>
        </tr>
        <tr align="center" style="background-color: aliceblue;">
            <td>Thursday</td>
            <td>CA</td>
            <td>OS</td>
            <td>AR</td>
            <td>DBMS</td>
            <td>SE</td>
        </tr>
        <tr align="center" style="background-color: aliceblue;">
            <td>Friday</td>
            <td>WT</td>
            <td>CA</td>
            <td colspan="2" style="text-align: center;">WT Lab</td>
            <td>DBMS</td>
        </tr>
    </table>
    
</body>
</html>
